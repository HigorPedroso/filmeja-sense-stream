workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple Developer
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.filmeja.app
      groups:
        - filmeja_secrets
      vars:
        BUNDLE_ID: "com.filmeja.app"
        # This project uses Capacitor's Swift Package Manager integration
        # (no CocoaPods, no Podfile), so there's no wrapping .xcworkspace —
        # only the plain .xcodeproj.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.11.0
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      # The distribution certificate is uploaded manually in Codemagic's
      # Code signing identities (Team/App settings → iOS certificates) —
      # generated locally with openssl and combined with the certificate
      # Apple issued for it, entirely separate from the certificate the
      # user's other 3 apps already use. use-profiles finds it there and
      # fetches/creates the matching provisioning profile automatically.
      - name: Fetch/generate provisioning profiles and apply to the Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          # get-latest-app-store-build-number only counts builds attached to
          # a *production* App Store version — since this workflow only ever
          # ships to TestFlight, that would return 0 forever and every
          # upload after the first would collide on build number 1 and get
          # rejected. get-latest-testflight-build-number tracks every build
          # ever uploaded for this bundle ID, TestFlight included.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
