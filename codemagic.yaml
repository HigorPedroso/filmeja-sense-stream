workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple Developer
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.filmeja.app
      groups:
        - filmeja_secrets
      vars:
        BUNDLE_ID: "com.filmeja.app"
        # This project uses Capacitor's Swift Package Manager integration
        # (no CocoaPods, no Podfile), so there's no wrapping .xcworkspace —
        # only the plain .xcodeproj.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22.11.0
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Set up keychain
        script: keychain initialize
      # The distribution certificate is uploaded manually in Codemagic's
      # Code signing identities (Team/App settings → iOS certificates) —
      # generated locally with openssl and combined with the certificate
      # Apple issued for it, entirely separate from the certificate the
      # user's other 3 apps already use. It doesn't end up in the build's
      # keychain on its own though — add-certificates is what actually
      # pulls it in (via the CM_CERTIFICATE/CM_CERTIFICATE_PASSWORD env
      # vars Codemagic injects for whatever's uploaded).
      - name: Add uploaded certificate to the keychain
        script: keychain add-certificates
      # Both the certificate and the App Store provisioning profile are
      # uploaded manually in Codemagic's Code signing identities — automatic
      # creation of either one kept failing (certificate: no private key
      # available to reuse; profile: fetch-signing-files --create never
      # actually created one, just kept reporting none found). use-profiles
      # just needs to find and apply what's already uploaded.
      - name: Apply signing files to the Xcode project
        script: xcode-project use-profiles
      - name: Set build number from timestamp
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          # get-latest-testflight-build-number turned out unreliable here —
          # a build still got rejected for reusing build number 1 despite
          # incrementing off of it. A minute-precision timestamp is always
          # higher than whatever came before, with no dependency on querying
          # App Store Connect for "the latest" anything.
          agvtool new-version -all $(date +%Y%m%d%H%M)
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
